###############################################################################
## 1. SSL
ssl.truststore.file     = etc/demo-truststore
ssl.truststore.password = changeit
## Truststore file check interval in seconds (default 30, 0 = load once). Without a truststore the JVM's CA certificates are used.
#ssl.truststore.reload.interval = 30
ssl.keystore.file       = etc/demo-keystore
ssl.keystore.password   = changeit
ssl.keystore.type       = JKS
## Keystore file check interval in seconds (default 30, 0 = load once).
## The client key is the oldest unexpired key in the keystore; a changed file is reloaded.
#ssl.keystore.reload.interval = 30

###############################################################################
## 2. AP
ap.id                   = http://demo_ap
ap.password             = demo

###############################################################################
## 3. MSSP
