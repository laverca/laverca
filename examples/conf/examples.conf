mssp.status.url         = https://mssp.demo.methics.fi:9011/soap/services/MSS_StatusQueryPort
mssp.receipt.url        = https://mssp.demo.methics.fi:9011/soap/services/MSS_ReceiptPort
mssp.profile.url        = https://mssp.demo.methics.fi:9011/soap/services/MSS_ProfileQueryPort
